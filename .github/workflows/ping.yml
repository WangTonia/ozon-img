name: ping-images
on: [push, workflow_dispatch]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: fetch images from Pages
        run: |
          fail=0
          for f in heat_main_800 heat_02_800 heat_03_800 heat_04_800 heat_05_800 heat_06_800 heat_07_800; do
            code=$(curl -s -o /dev/null -w "%{http_code}:%{size_download}" --max-time 30 -A "Mozilla/5.0" "https://wangtonia.github.io/ozon-img/ozon/${f}.jpg")
            echo "RESULT ozon/${f}.jpg -> ${code}"
          done
          n=0; bad=0
          for f in $(curl -s --max-time 30 "https://api.github.com/repos/WangTonia/ozon-img/contents/pijian?ref=main" | grep '"name"' | sed 's/.*"name": "//;s/".*//' | head -8); do
            code=$(curl -s -o /dev/null -w "%{http_code}:%{size_download}" --max-time 30 -A "Mozilla/5.0" "https://wangtonia.github.io/ozon-img/pijian/${f}")
            echo "RESULT pijian/${f} -> ${code}"
          done
